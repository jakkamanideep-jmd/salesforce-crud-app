<!DOCTYPE html>
<html>
<head>
  <title>Salesforce CRUD App</title>
</head>
<body>
  <h1>Salesforce CRUD App</h1>

  <!-- Login -->
  <button onclick="window.location.href='/login'">Login to Salesforce</button>

  <!-- Object Dropdown -->
  <h2>Select Object</h2>
  <select id="objectDropdown">
    <option value="accounts">Accounts</option>
    <option value="contacts">Contacts</option>
    <option value="opportunities">Opportunities</option>
    <option value="leads">Leads</option>
    <option value="cases">Cases</option>
  </select>

  <!-- Records Table -->
  <h2>Records</h2>
  <table border="1" id="recordsTable">
    <thead>
      <tr id="tableHeader"></tr>
    </thead>
    <tbody id="tableBody"></tbody>
  </table>

  <!-- Create Account Form -->
  <h2>Create Account</h2>
  <form id="accountForm">
    <input type="text" id="accountName" placeholder="Account Name" required />
    <button type="submit">Create Account</button>
  </form>

  <!-- Create Contact Form -->
  <h2>Create Contact</h2>
  <form id="contactForm">
    <input type="text" id="lastName" placeholder="Last Name" required />
    <input type="text" id="firstName" placeholder="First Name" />
    <input type="email" id="email" placeholder="Email" />
    <input type="text" id="phone" placeholder="Phone" />
    <button type="submit">Create Contact</button>
  </form>

  <script src="app.js"></script>
</body>
</html>
