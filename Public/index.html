<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Salesforce CRUD App</title>
  <!-- Bootstrap CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-4">

  <!-- Login -->
  <div class="mb-3">
    <button class="btn btn-primary">Login to Salesforce</button>
  </div>

  <!-- Dropdown -->
  <div class="mb-3">
    <label for="objectDropdown" class="form-label">Select Object</label>
    <select id="objectDropdown" class="form-select">
      <option value="accounts">Accounts</option>
      <option value="contacts">Contacts</option>
      <option value="opportunities">Opportunities</option>
      <option value="leads">Leads</option>
      <option value="cases">Cases</option>
    </select>
  </div>

  <!-- Records Table -->
  <h3>Records</h3>
  <table class="table table-striped table-bordered">
    <thead>
      <tr id="tableHeader"></tr>
    </thead>
    <tbody id="tableBody"></tbody>
  </table>

  <!-- Create Account -->
  <h3>Create Account</h3>
  <form id="accountForm" class="mb-3">
    <div class="mb-3">
      <label for="accountName" class="form-label">Account Name</label>
      <input type="text" id="accountName" class="form-control" required>
    </div>
    <button type="submit" class="btn btn-primary">Create Account</button>
  </form>

  <!-- Create Contact -->
  <h3>Create Contact</h3>
  <form id="contactForm" class="mb-3">
    <div class="mb-3">
      <label for="lastName" class="form-label">Last Name</label>
      <input type="text" id="lastName" class="form-control" required>
    </div>
    <div class="mb-3">
      <label for="firstName" class="form-label">First Name</label>
      <input type="text" id="firstName" class="form-control" required>
    </div>
    <div class="mb-3">
      <label for="email" class="form-label">Email</label>
      <input type="email" id="email" class="form-control" required>
    </div>
    <div class="mb-3">
      <label for="phone" class="form-label">Phone</label>
      <input type="text" id="phone" class="form-control" required>
    </div>
    <button type="submit" class="btn btn-primary">Create Contact</button>
  </form>

  <!-- JS -->
  <script src="app.js"></script>
</body>
</html>
